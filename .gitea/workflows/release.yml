# Publishes a release on Gitea: crafty_controller.zip, with notes from that version's section of CHANGELOG.md.
#
# Two ways to start it:
#   - Actions tab → Release → Run workflow, and enter the version (1.2.1). This also creates the tag (v1.2.1) on
#     the commit it releases.
#   - Push a version tag:  git tag v1.2.1 && git push origin v1.2.1
# It refuses to publish unless every version in the project and CHANGELOG.md agree with it and every check passes,
# so a release always matches the code in it. A version with a suffix (-beta) is a pre-release.
#
# With Gitea push-mirroring to GitHub, the new tag reaches GitHub at the mirror's next push, and GitHub's own release
# workflow (.github/workflows/release.yml) then publishes the same release there, built from the same tag: that's the
# copy the Marketplace installs from.
#
# Like test.yml it uses no actions, so it works when GitHub can't be reached. The release notes still point at
# the public copy on GitHub (PUBLIC_REPOSITORY), which is where people install from.
name: Release

on:
  push:
    tags: ["v*.*.*", "V*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 1.2.1)"
        required: true

# Read-only by default; only the release job may write, and only its last step gets the release token.
# (Gitea versions without workflow permissions ignore this: then set a RELEASE_TOKEN secret that can only make
# releases, and the repository's default token permissions to read-only.)
permissions:
  contents: read

env:
  PUBLIC_REPOSITORY: soullink9/HA-Marketplace-Crafty-Controller
  # Gitea's address as the job containers can reach it, if that isn't its public address (ROOT_URL): for a runner
  # next to Gitea, e.g. http://gitea-server:3000. Set it once as an Actions variable on your user or organisation.
  GITEA_INTERNAL_URL: ${{ vars.GITEA_INTERNAL_URL }}

jobs:
  tests:
    # Home Assistant 2026.11 runs on Python 3.14, the only version this integration supports, so that's what the tests run on
    runs-on: ubuntu-latest
    container:
      # Pinned by digest, so a changed image can't slip into a run. To update: docker pull python:3.14-bookworm, then
      # take the digest from docker inspect --format '{{index .RepoDigests 0}}' python:3.14-bookworm.
      image: python:3.14-bookworm@sha256:3fe825da0a80fa8e2cd79baadeb76b03c0ddf3d6cdbc8346778a0208b9d6038c
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          # The token goes to git through its environment, for these fetches only: not on a command line (which any
          # process can read) and not saved in .git/config, so nothing that runs later in the job can find it there.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          fetch() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
              git fetch -q --depth 1 "$repo" "$1"
          }
          # the exact commit that started the run; its branch or pull request as a fallback
          fetch "$GITHUB_SHA" || fetch "$GITHUB_REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='Testing %h %s'

      - name: Install what the checks need (from PyPI)
        run: pip install --no-cache-dir ruff==0.17.6

      - name: Lint and format (ruff)
        run: ruff check && ruff format --check

      - name: Tests
        run: |
          python3 tests/test_integration.py &&
            python3 tests/test_release.py

      - name: Build crafty_controller.zip, and check it installs as custom_components/crafty_controller/
        run: python3 scripts/build_package.py

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    container:
      # Pinned by digest, so a changed image can't slip into a run. To update: docker pull python:3.14-bookworm, then
      # take the digest from docker inspect --format '{{index .RepoDigests 0}}' python:3.14-bookworm.
      image: python:3.14-bookworm@sha256:3fe825da0a80fa8e2cd79baadeb76b03c0ddf3d6cdbc8346778a0208b9d6038c
    steps:
      - name: Get the code
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git init -q .
          repo="${GITEA_INTERNAL_URL:-$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY.git"
          # The token goes to git through its environment, for these fetches only: not on a command line (which any
          # process can read) and not saved in .git/config, so nothing that runs later in the job can find it there.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          fetch() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
              git fetch -q --depth 1 "$repo" "$1"
          }
          # the exact commit that started the run; its branch or pull request as a fallback
          fetch "$GITHUB_SHA" || fetch "$GITHUB_REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='Releasing %h %s'

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${INPUT_VERSION#[vV]}"  # (a "v" typed by mistake is fine)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the version and take the release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/release_notes.py "$TAG" "$PUBLIC_REPOSITORY" notes.md >> "$GITHUB_OUTPUT"

      - name: Build crafty_controller.zip, and check it installs as custom_components/crafty_controller/
        run: python3 scripts/build_package.py

      - name: Publish on Gitea
        env:
          # the job's own token; set a RELEASE_TOKEN secret instead if your Gitea doesn't let it make releases
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: python3 scripts/publish_gitea_release.py "$TAG" "$COMMIT" "$TITLE" notes.md "$PRERELEASE" dist/*
